[package]
name = "abuse_scraping_classifier"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

[package.metadata.anypoint]
group_id = "030e0aac-30d9-460f-9234-428c16a123c4"
definition_asset_id = { name = "abuse-scraping-classifier", version = "1.0.0" }
implementation_asset_id = "abuse-scraping-classifier-flex"

[dependencies]
# enable_stop_iteration: kept for family parity and to support an early
# Flow::Break(429) rejection in the request phase (blockVerdicts). This policy is
# header-only — it never buffers a request or response body.
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
